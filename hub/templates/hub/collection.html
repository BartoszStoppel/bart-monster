{% extends "hub/base.html" %}
{% block content %}
  <div class="heading">
    <div>
      <p class="eyebrow">The group shelf</p>
      <h1>Collection</h1>
      <p class="muted">{{ games|length }} games</p>
    </div>
    <a class="button" href="/search">Add a game</a>
  </div>
  <form class="filters" method="get">
    <label>
      Search<input type="search" name="q" value="{{ query }}" placeholder="Find a game…">
    </label>
    <label>
      Category<select name="category">
      <option value="">All games</option>
      <option value="board" {% if request.GET.category == 'board' %}selected{% endif %}>Board games</option>
      <option value="party"
              {% if request.GET.category == 'party' %}selected{% endif %}>Party games</option>
    </select>
  </label>
  <label>
    Show<select name="filter">
    <option value="">Everyone's games</option>
    <option value="owned" {% if request.GET.filter == 'owned' %}selected{% endif %}>Our household owns</option>
    <option value="wishlist"
            {% if request.GET.filter == 'wishlist' %}selected{% endif %}>Our wishlist</option>
    <option value="unranked"
            {% if request.GET.filter == 'unranked' %}selected{% endif %}>I haven't ranked</option>
  </select>
  </label>
  <label>
    Sort<select name="sort">
    <option value="name" {% if sort == 'name' %}selected{% endif %}>Name</option>
    <option value="community" {% if sort == 'community' %}selected{% endif %}>Group score</option>
    <option value="bgg" {% if sort == 'bgg' %}selected{% endif %}>BGG rating</option>
    <option value="difficulty" {% if sort == 'difficulty' %}selected{% endif %}>Difficulty</option>
    <option value="time" {% if sort == 'time' %}selected{% endif %}>Play time</option>
    <option value="decorated" {% if sort == 'decorated' %}selected{% endif %}>Decorated</option>
    </select>
  </label>
  <button>Apply</button>
  </form>
  <div class="grid">
    {% for game in games %}
      {% include "hub/card.html" %}
    {% empty %}
      <p class="empty">
        No games here yet. <a href="/search">Find one on BoardGameGeek.</a>
      </p>
    {% endfor %}
  </div>
{% endblock %}
