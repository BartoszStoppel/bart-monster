{% extends "hub/base.html" %}
{% block content %}
  <div class="reading">
    <h1>Talk games</h1>
    <p class="muted">Ask about the collection, compare tastes, or get help with a game's rules.</p>
    {% if not configured %}
      <p class="notice">Chat needs an Anthropic API key configured on the server.</p>
    {% endif %}
    <div id="chat-messages" aria-live="polite"></div>
    <form id="chat-form" class="panel">
      {% csrf_token %}
      <label for="chat-input">Your message</label>
      <textarea id="chat-input" rows="3" required maxlength="8000" placeholder="What should we play tonight?">
</textarea>
      <div class="inline">
        <button {% if not configured %}disabled{% endif %}>Send</button>
        <button type="button" id="clear-chat" class="quiet">Clear conversation</button>
      </div>
      <p id="chat-status" role="status"></p>
    </form>
  </div>
{% endblock %}
