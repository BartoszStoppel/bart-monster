[project]
name = "bart-monster"
version = "0.2.0"
description = "A small Django home for a board-game group"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "dj-database-url>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "defusedxml>=0.7,<1",
  "python-dotenv>=1,<2",
  "anthropic>=0.79,<1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
