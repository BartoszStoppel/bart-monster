{% extends "hub/base.html" %}
{% block content %}
  <section class="login panel">
    <p class="eyebrow">Your next game night starts here</p>
    <h1>Board Game Hub</h1>
    <p class="muted">Collect games. Rank your favorites. Find something everyone wants to play.</p>
    <form method="post" action="/login/google">
      {% csrf_token %}
      <button>Continue with Google</button>
    </form>
    <details>
      <summary>Sign in with a local account</summary>
      <form method="post">
        {% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}">
        <button>Sign in</button>
      </form>
    </details>
  </section>
{% endblock %}
